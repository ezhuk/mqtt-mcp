[project]
name = "mqtt-mcp"
version = "0.4.0"
description = "A Model Context Protocol (MCP) server for MQTT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.0",
    "paho-mqtt>=2.1.0",
    "pydantic-settings>=2.16.0",
    "typer>=0.27.0",
]

[project.scripts]
mqtt-mcp = "mqtt_mcp.cli:app"

[build-system]
requires = ["uv_build>=0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.95",
]

[tool.ty.src]
exclude = [
    "examples",
]
